<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Veil</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/touch-controls.css">
</head>
<body>
  <div id="gameContainer">
    <div id="viewport">
      <div id="menuTopTabs"></div>
      <canvas id="gameCanvas" width="640" height="360"></canvas>
      <div id="prompt"></div>
      <div id="dialogPromptContainer"></div>
      <div id="miniMap">
        <canvas id="miniMapCanvas" width="500" height="500"></canvas>
      </div>
      <div id="mapOverlay">
        <div id="mapPanel">
          <canvas id="mapCanvas" width="520" height="360"></canvas>
          <button id="mapCloseButton" type="button" aria-label="Close map">×</button>
        </div>
      </div>
      <button id="manualTargetingBackButton" type="button">← Back</button>

      <div id="conversationOverlay">
        <img id="conversationPortrait" src="" alt="Portrait">
        <div id="dialogBox"></div>
        <div id="optionsBox"></div>
      </div>
      <div id="playerMenuOverlay">
        <div id="playerMenuError" style="display:none; color:#ffb0b0; font-size:13px;"></div>
        <div id="playerMenuContent"></div>
      </div>

    </div>
  </div>
  <!-- Use a plain script tag instead of type="module" to avoid CORS
       issues when running from the local filesystem. The game code
       operates in the global scope and does not rely on ES module
       imports. -->
  <script src="js/main.js"></script>
  <script src="js/touch-controls.js"></script>
</body>
</html>
